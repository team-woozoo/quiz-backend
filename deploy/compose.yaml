# 서버용 compose. 같은 폴더의 .env 에서 값을 읽는다 (.env.example 참고)
name: quiz-backend

services:
  app:
    image: ${APP_IMAGE:-quiz-backend:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB 를 .env 에 설정해야 한다}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER 를 .env 에 설정해야 한다}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정해야 한다}
    ports:
      - "8080:8080"
    mem_limit: 1g

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # PG18 이미지는 데이터를 /var/lib/postgresql 아래 버전별 폴더에 둔다
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # DB 포트는 열지 않는다. 앱만 compose 내부 네트워크로 접속한다
    mem_limit: 512m

volumes:
  postgres-data:
