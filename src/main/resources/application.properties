spring.application.name=quiz-backend

spring.profiles.default=local

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=14d

# Upload limits. Larger files are rejected with 413 before reaching the controller
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
# Pages with text allowed per material. More pages mean more text sent to the generator
material.upload.max-pages=100

# Number of questions requested from the generator per quiz
quiz.generation.question-count=10
# fake: builds questions from the chunks without calling AI. llm: calls the school LLM gateway (llm profile)
quiz.generation.generator=fake
# The fake generator waits this long so the app can show the in-progress state
quiz.generation.fake-delay=10s
# SSE connections close after this long. Longer than the slowest LLM call with its retry (2 x 120s)
quiz.generation.sse-timeout=5m

# The OpenAI starter builds a client for every model type and each one needs a key.
# Only chat is used, and only under the llm profile. Local runs and tests never reach the gateway
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Document response media type as application/json instead of */* in Swagger
springdoc.default-produces-media-type=application/json
# The app generates its client with swagger_parser. OpenAPI 3.0 marks nullable fields with nullable: true
springdoc.api-docs.version=openapi_3_0
