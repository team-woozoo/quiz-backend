# Generates quizzes through the school LLM gateway (OpenAI compatible API in front of Bedrock).
# The gateway blocks the key once its budget is used up, so this profile is only for the server and for manual checks
quiz.generation.generator=llm
spring.ai.model.chat=openai

# The key and URL come from the environment and are never committed
spring.ai.openai.base-url=${LLM_BASE_URL}
spring.ai.openai.api-key=${LLM_API_KEY}

# Compared on the same materials, luna followed the quote and cognitive type rules best, with fewer tokens and no
# factual errors in its explanations. Haiku dropped most higher-order questions and Sonnet was slower and costlier.
# Those comparisons used bedrock-gpt-5.6-luna, which the gateway replaced with bedrock-gpt-6-luna on 2026-11-17
spring.ai.openai.chat.model=${LLM_MODEL:bedrock-gpt-6-luna}
# Keeping the output format matters more than varied wording
spring.ai.openai.chat.temperature=0.3
# Ten questions with options, explanations and quotes run to several thousand tokens. A cut-off response is unusable.
# Reasoning tokens count toward this cap. 6-luna reasons by default and used 7,300 to 9,000 output tokens,
# so 8,000 cut off two of five runs
spring.ai.openai.chat.max-tokens=${LLM_MAX_TOKENS:16000}
# Reasoning effort for the generator only (low, medium, high and so on). Left empty, nothing is sent and the
# gateway default applies. Higher effort adds reasoning tokens to the output and takes longer
quiz.generation.reasoning-effort=${LLM_REASONING_EFFORT:}
# One generation can take close to a minute. A retry resends the whole material, so allow only one.
# Slower models such as Sonnet can pass two minutes on long outputs, so the limit can be raised per environment.
# The adapters also put this limit on each call, because Spring AI otherwise adds its own 60s per-call timeout
# that wins over the client setting. A timed-out call is retried once, so a failure takes about twice this long
spring.ai.openai.timeout=${LLM_TIMEOUT:120s}
spring.ai.openai.max-retries=1

# A different model from the generator judges each cognitive type, so the two labels can be compared.
# bedrock-sonnet now points to Claude Sonnet 5.5 (it was 3.5 v2 until that reached end of life on 2026-11-15).
# Compared with Haiku and luna as judges, it dropped mislabeled questions just as accurately, judged the same pattern
# the same way across runs, and took 6 to 8 seconds without reasoning
quiz.generation.judge=llm
quiz.generation.judge-model=${LLM_JUDGE_MODEL:bedrock-sonnet}
# Holds one short reason per question. A cut-off response counts as a failed judgement
quiz.generation.judge-max-tokens=${LLM_JUDGE_MAX_TOKENS:3000}
# Reasoning effort for the judge only. Left empty, nothing is sent and the judge runs at temperature 0.
# Claude accepts only temperature 1 with reasoning, and reasoning tokens count toward the output cap above
quiz.generation.judge-reasoning-effort=${LLM_JUDGE_REASONING_EFFORT:}

# Each upload is checked for study content and split into concepts before it is saved, so the upload waits for this call.
# Compared on two materials, Sonnet gave the most even concept sizes and the most accurate material tags,
# and took 10 to 18 seconds. luna lumped related sections into one concept and Haiku tagged factors that were not there.
# Concept names become the key for later quizzes and study records, so accuracy matters more than speed here
quiz.material.analyzer=llm
quiz.material.analysis-model=${LLM_ANALYSIS_MODEL:bedrock-sonnet}
# Sonnet used 1,700 to 3,200 output tokens for 11 to 18 concepts. A cut-off response counts as a failed analysis
quiz.material.analysis-max-tokens=${LLM_ANALYSIS_MAX_TOKENS:8000}
# The upload waits for this call, so it gives up sooner than generation (spring.ai.openai.timeout).
# The adapter puts this limit on each call. A timed-out call is retried once, so a failure takes about twice this long
quiz.material.analysis-timeout=${LLM_ANALYSIS_TIMEOUT:60s}
