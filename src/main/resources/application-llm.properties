# Generates quizzes through the school LLM gateway (OpenAI compatible API in front of Bedrock).
# The gateway blocks the key once its budget is used up, so this profile is only for the server and for manual checks
quiz.generation.generator=llm
spring.ai.model.chat=openai

# The key and URL come from the environment and are never committed
spring.ai.openai.base-url=${LLM_BASE_URL}
spring.ai.openai.api-key=${LLM_API_KEY}

# Compared on the same materials, luna followed the quote and cognitive type rules best, with fewer tokens and no
# factual errors in its explanations. Haiku dropped most higher-order questions and Sonnet was slower and costlier
spring.ai.openai.chat.model=${LLM_MODEL:bedrock-gpt-5.6-luna}
# Keeping the output format matters more than varied wording
spring.ai.openai.chat.temperature=0.3
# Ten questions with options, explanations and quotes run to several thousand tokens. A cut-off response is broken JSON.
# Luna used up to about 5,200 output tokens. Some models reject a cap above their limit (Sonnet allows 8,192)
spring.ai.openai.chat.max-tokens=${LLM_MAX_TOKENS:8000}
# One generation can take close to a minute. A retry resends the whole material, so allow only one
spring.ai.openai.chat.timeout=120s
spring.ai.openai.chat.max-retries=1
